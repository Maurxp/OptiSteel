name: OptiSteel 2.0 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Build, Typecheck & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies (Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run Core Test Suite (@optisteel/core)
        run: pnpm test:core

      - name: Run Web Integration Tests (@optisteel/web)
        run: pnpm test:web

      - name: Build Core Package (@optisteel/core)
        run: pnpm build:core

      - name: Typecheck Monorepo (tsc --noEmit)
        run: pnpm typecheck

      - name: Build Web Application (@optisteel/web)
        run: pnpm build:web

      - name: Verify Web Production Artifacts
        run: |
          test -f apps/web/dist/index.html || { echo "Error: apps/web/dist/index.html not found"; exit 1; }
          test -f apps/web/dist/_redirects || { echo "Error: apps/web/dist/_redirects not found"; exit 1; }
          test -f apps/web/dist/_headers || { echo "Error: apps/web/dist/_headers not found"; exit 1; }
          echo "Production artifacts verified successfully."

      - name: Check Git Diff Cleanliness
        run: git diff --check
